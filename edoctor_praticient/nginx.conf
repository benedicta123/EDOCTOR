server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support du routage SPA / Flutter Web (évite les 404 sur rafraîchissement)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression gzip pour accélérer le chargement
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Mise en cache des assets statiques (CanvasKit, polices, scripts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
