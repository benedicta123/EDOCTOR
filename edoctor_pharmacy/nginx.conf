server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes HTTP de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Ne jamais mettre en cache index.html, version.json, manifest et scripts d'initialisation Flutter
    location ~* (index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Support du routage SPA / Flutter Web (évite les 404 sur rafraîchissement)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Compression gzip pour accélérer le chargement
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Mise en cache des assets statiques (CanvasKit, polices, images)
    location ~* \.(png|jpg|jpeg|gif|ico|woff|woff2|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
